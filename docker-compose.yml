version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/Images:/images
      - ./database/ddl.sql:/docker-entrypoint-initdb.d/01_ddl.sql
      - ./database/indexes.sql:/docker-entrypoint-initdb.d/02_indexes.sql
      - ./database/views.sql:/docker-entrypoint-initdb.d/03_views.sql
      - ./database/seed_01_base.sql:/docker-entrypoint-initdb.d/04_seed_01.sql
      - ./database/seed_02_entidades.sql:/docker-entrypoint-initdb.d/05_seed_02.sql
      - ./database/seed_03_transacciones.sql:/docker-entrypoint-initdb.d/06_seed_03.sql
      
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
